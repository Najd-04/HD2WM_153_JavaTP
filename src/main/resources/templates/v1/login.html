<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/base}">


<body>
<title layout:fragment="title">Login </title>
<div layout:fragment="content">
    <div class="uk-container">

        <h1>Se Connecter</h1>
        <div th:if="${param.logout}"> Déconnexion réalisée avec succés</div>
        <div th:if="${param.error}">Votre login ou mot de passe est incorrect</div>
    </div>
    <form method="post" th:action="@{/login}">
        <!-- th:object="${user}"//  th:field="*{email}// th:field="*{password}-->
        <input placeholder="saisir l'email" class="uk-input" name="username"/>
<!--        <ul th:if="${#fields.hasErrors('email')}">-->
<!--            <li class="uk-form-danger" th:each="error: ${#fields.errors('email')}" th:text="${error}"></li>-->
<!--        </ul>-->

        <input placeholder="saisir le mot de passe" class="uk-input" type="password" name="password"/>

        <div class="uk-margin">
            <input value="Se connecter" type="submit" class=" uk-button uk-button-primary uk-width-1-1">
        </div>
    </form>
</div>
</div>
</body>
</html>
