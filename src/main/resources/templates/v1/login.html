<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/base}">


<body>
<title layout:fragment="title">Login  </title>
<div layout:fragment="content">
<div class="uk-container">

    <h1>Login</h1>
    <form th:object="${user}" method="post" action="login">

        <input th:field="*{email}" placeholder="saisir l'email" />

        <input th:field="*{password}" placeholder="saisir le mot de passe" class="uk-input"/>

        <div class="uk-margin">
            <input  value="Se connecter" type="submit" class=" uk-button uk-button-primary uk-width-1-1">
        </div>
    </form>
</div>
</div>
</body>
</html>
